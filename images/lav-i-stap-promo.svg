<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Deep space background -->
    <radialGradient id="bgGrad" cx="50%" cy="48%" r="72%">
      <stop offset="0%" stop-color="#0e0828"/>
      <stop offset="35%" stop-color="#080520"/>
      <stop offset="70%" stop-color="#04030f"/>
      <stop offset="100%" stop-color="#010108"/>
    </radialGradient>

    <!-- Nebula blob 1 — purple -->
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a1a90" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a1a90" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebula blob 2 — blue -->
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3a90" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a3a90" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebula blob 3 — lavender -->
    <radialGradient id="neb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7060c0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7060c0" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring gradient — silver-blue-lavender -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a0b8e0"/>
      <stop offset="20%"  stop-color="#d0d8f8"/>
      <stop offset="40%"  stop-color="#8090c8"/>
      <stop offset="60%"  stop-color="#c0c8f0"/>
      <stop offset="80%"  stop-color="#9878d0"/>
      <stop offset="100%" stop-color="#a0b8e0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="outerGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="midGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"  result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- Nebula clouds -->
  <ellipse cx="230" cy="280" rx="340" ry="260" fill="url(#neb1)"/>
  <ellipse cx="870" cy="750" rx="280" ry="220" fill="url(#neb2)"/>
  <ellipse cx="600" cy="200" rx="220" ry="160" fill="url(#neb3)"/>
  <ellipse cx="180" cy="830" rx="200" ry="160" fill="url(#neb2)"/>
  <ellipse cx="540" cy="540" rx="500" ry="400" fill="url(#neb1)" opacity="0.4"/>

  <!-- ── STARS ── -->
  <!-- Large bright stars -->
  <g fill="#ffffff">
    <circle cx="78"  cy="62"  r="1.8" opacity="0.95"/>
    <circle cx="142" cy="198" r="1.4" opacity="0.80"/>
    <circle cx="210" cy="45"  r="2.2" opacity="0.90"/>
    <circle cx="312" cy="130" r="1.2" opacity="0.70"/>
    <circle cx="420" cy="78"  r="1.6" opacity="0.85"/>
    <circle cx="530" cy="38"  r="1.9" opacity="0.92"/>
    <circle cx="650" cy="90"  r="1.3" opacity="0.75"/>
    <circle cx="760" cy="55"  r="2.0" opacity="0.88"/>
    <circle cx="880" cy="140" r="1.5" opacity="0.80"/>
    <circle cx="995" cy="70"  r="1.7" opacity="0.85"/>
    <circle cx="48"  cy="310" r="1.4" opacity="0.72"/>
    <circle cx="100" cy="480" r="1.8" opacity="0.82"/>
    <circle cx="55"  cy="640" r="1.3" opacity="0.68"/>
    <circle cx="90"  cy="800" r="2.0" opacity="0.88"/>
    <circle cx="40"  cy="950" r="1.5" opacity="0.75"/>
    <circle cx="980" cy="250" r="1.6" opacity="0.80"/>
    <circle cx="1040" cy="420" r="1.9" opacity="0.90"/>
    <circle cx="995" cy="600" r="1.4" opacity="0.72"/>
    <circle cx="1020" cy="760" r="2.1" opacity="0.88"/>
    <circle cx="970" cy="920" r="1.6" opacity="0.78"/>
    <circle cx="200" cy="970" r="1.8" opacity="0.82"/>
    <circle cx="380" cy="1020" r="1.4" opacity="0.70"/>
    <circle cx="600" cy="1040" r="1.9" opacity="0.85"/>
    <circle cx="800" cy="990"  r="1.5" opacity="0.75"/>
    <circle cx="940" cy="1050" r="1.7" opacity="0.80"/>
  </g>
  <!-- Medium stars -->
  <g fill="#d8e0f8" opacity="0.75">
    <circle cx="160" cy="150" r="1.0"/>
    <circle cx="290" cy="220" r="0.9"/>
    <circle cx="370" cy="60"  r="1.1"/>
    <circle cx="470" cy="160" r="0.8"/>
    <circle cx="580" cy="110" r="1.0"/>
    <circle cx="700" cy="170" r="0.9"/>
    <circle cx="820" cy="95"  r="1.1"/>
    <circle cx="930" cy="190" r="0.8"/>
    <circle cx="130" cy="390" r="1.0"/>
    <circle cx="170" cy="540" r="0.9"/>
    <circle cx="120" cy="700" r="1.1"/>
    <circle cx="155" cy="870" r="0.8"/>
    <circle cx="940" cy="340" r="1.0"/>
    <circle cx="960" cy="500" r="0.9"/>
    <circle cx="930" cy="680" r="1.1"/>
    <circle cx="945" cy="840" r="0.8"/>
    <circle cx="310" cy="990" r="1.0"/>
    <circle cx="490" cy="1010" r="0.9"/>
    <circle cx="700" cy="1025" r="1.1"/>
    <circle cx="860" cy="1000" r="0.8"/>
  </g>
  <!-- Lavender-tinted stars -->
  <g fill="#b0a0e0" opacity="0.65">
    <circle cx="250" cy="340" r="0.9"/>
    <circle cx="340" cy="410" r="0.8"/>
    <circle cx="180" cy="460" r="1.0"/>
    <circle cx="280" cy="550" r="0.7"/>
    <circle cx="150" cy="620" r="0.9"/>
    <circle cx="240" cy="720" r="0.8"/>
    <circle cx="810" cy="310" r="0.9"/>
    <circle cx="900" cy="420" r="0.8"/>
    <circle cx="860" cy="560" r="1.0"/>
    <circle cx="920" cy="640" r="0.7"/>
    <circle cx="840" cy="750" r="0.9"/>
    <circle cx="880" cy="870" r="0.8"/>
  </g>
  <!-- Tiny sparkle dust -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="330" cy="170" r="0.6"/>
    <circle cx="440" cy="220" r="0.5"/>
    <circle cx="555" cy="185" r="0.6"/>
    <circle cx="680" cy="140" r="0.5"/>
    <circle cx="740" cy="250" r="0.6"/>
    <circle cx="850" cy="200" r="0.5"/>
    <circle cx="110" cy="270" r="0.6"/>
    <circle cx="190" cy="720" r="0.5"/>
    <circle cx="960" cy="480" r="0.6"/>
    <circle cx="1000" cy="550" r="0.5"/>
    <circle cx="420" cy="950" r="0.6"/>
    <circle cx="660" cy="975" r="0.5"/>
  </g>

  <!-- ── RING — outer diffuse glow ── -->
  <circle cx="540" cy="490" r="315" fill="none"
          stroke="rgba(100,120,210,0.06)" stroke-width="120"
          filter="url(#outerGlow)"/>

  <!-- Ring — mid glow layer -->
  <circle cx="540" cy="490" r="315" fill="none"
          stroke="rgba(140,160,240,0.20)" stroke-width="55"
          filter="url(#midGlow)"/>

  <!-- Ring — inner soft halo -->
  <circle cx="540" cy="490" r="315" fill="none"
          stroke="rgba(180,195,250,0.35)" stroke-width="22"/>

  <!-- Ring — bright core stroke -->
  <circle cx="540" cy="490" r="315" fill="none"
          stroke="url(#ringGrad)" stroke-width="4" opacity="0.95"/>

  <!-- Ring — hot white inner edge -->
  <circle cx="540" cy="490" r="313" fill="none"
          stroke="rgba(240,245,255,0.55)" stroke-width="1.5"/>

  <!-- Scattered ring sparkle dots -->
  <g filter="url(#softGlow)">
    <!-- Top arc sparkles -->
    <circle cx="313" cy="283" r="3.5" fill="#e0e8ff" opacity="0.90"/>
    <circle cx="410" cy="196" r="2.5" fill="#ffffff"  opacity="0.85"/>
    <circle cx="490" cy="178" r="4.0" fill="#d8e4ff"  opacity="0.92"/>
    <circle cx="575" cy="177" r="2.8" fill="#ffffff"  opacity="0.80"/>
    <circle cx="660" cy="196" r="3.2" fill="#e0e8ff"  opacity="0.88"/>
    <circle cx="750" cy="240" r="2.4" fill="#ffffff"  opacity="0.82"/>
    <circle cx="770" cy="280" r="3.8" fill="#c8d4f8"  opacity="0.90"/>
    <!-- Right arc sparkles -->
    <circle cx="840" cy="370" r="2.6" fill="#ffffff"  opacity="0.78"/>
    <circle cx="854" cy="460" r="3.4" fill="#e0e8ff"  opacity="0.88"/>
    <circle cx="847" cy="550" r="2.2" fill="#ffffff"  opacity="0.75"/>
    <circle cx="820" cy="635" r="3.0" fill="#d0d8f8"  opacity="0.85"/>
    <!-- Bottom arc sparkles -->
    <circle cx="770" cy="700" r="2.8" fill="#ffffff"  opacity="0.80"/>
    <circle cx="700" cy="750" r="3.5" fill="#e0e8ff"  opacity="0.90"/>
    <circle cx="615" cy="783" r="2.4" fill="#ffffff"  opacity="0.78"/>
    <circle cx="540" cy="793" r="4.2" fill="#d8e4ff"  opacity="0.92"/>
    <circle cx="460" cy="783" r="2.6" fill="#ffffff"  opacity="0.80"/>
    <circle cx="378" cy="748" r="3.0" fill="#e0e8ff"  opacity="0.86"/>
    <circle cx="308" cy="695" r="2.2" fill="#ffffff"  opacity="0.75"/>
    <!-- Left arc sparkles -->
    <circle cx="256" cy="625" r="3.6" fill="#d0d8f8"  opacity="0.88"/>
    <circle cx="233" cy="545" r="2.4" fill="#ffffff"  opacity="0.78"/>
    <circle cx="228" cy="460" r="3.8" fill="#e0e8ff"  opacity="0.92"/>
    <circle cx="245" cy="375" r="2.6" fill="#ffffff"  opacity="0.80"/>
    <circle cx="290" cy="300" r="3.0" fill="#d8e4ff"  opacity="0.85"/>
  </g>

  <!-- ── TEXT INSIDE RING ── -->

  <!-- Song title — italic serif style -->
  <text x="540" y="348"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="36" font-style="italic" font-weight="400"
        fill="#d8e4ff" text-anchor="middle" opacity="0.90"
        filter="url(#textGlow)">"Lav I Stap Ol Taem"</text>

  <!-- Main headline line 1 -->
  <text x="540" y="432"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="700" letter-spacing="2"
        fill="#ffffff" text-anchor="middle"
        filter="url(#textGlow)">PRE-ORDER</text>

  <!-- Main headline line 2 -->
  <text x="540" y="520"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="700" letter-spacing="2"
        fill="#ffffff" text-anchor="middle"
        filter="url(#textGlow)">TODAY</text>

  <!-- Date line -->
  <text x="540" y="580"
        font-family="'Arial', 'Helvetica', sans-serif"
        font-size="30" font-weight="600" letter-spacing="3"
        fill="#c0ccf0" text-anchor="middle">AVAILABLE APRIL 17TH</text>

  <!-- Button background -->
  <rect x="390" y="610" width="300" height="64" rx="32"
        fill="#0d0828" stroke="rgba(180,190,240,0.5)" stroke-width="1.5"/>

  <!-- Button text -->
  <text x="540" y="650"
        font-family="'Arial', 'Helvetica', sans-serif"
        font-size="26" font-weight="700" letter-spacing="3"
        fill="#e0e8ff" text-anchor="middle">LINK IN BIO</text>

  <!-- ── ARTIST NAME ── -->
  <text x="540" y="970"
        font-family="'Arial', 'Helvetica', sans-serif"
        font-size="52" font-weight="300" letter-spacing="12"
        fill="#c8d4f0" text-anchor="middle"
        filter="url(#textGlow)">VANUELLA WATT</text>

  <!-- Subtle awareness dots bottom -->
  <circle cx="390" cy="1020" r="6" fill="#9b59b6" opacity="0.7" filter="url(#softGlow)"/>
  <text x="406" y="1025" font-family="Arial" font-size="14" fill="rgba(180,170,220,0.6)" letter-spacing="1">Alzheimer's &amp; Parkinson's Awareness</text>
  <circle cx="772" cy="1020" r="6" fill="#7fb3d3" opacity="0.7" filter="url(#softGlow)"/>
</svg>
