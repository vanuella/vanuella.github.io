// ── Draw one countdown card ──
function drawCountdown(canvas, num) {
  const ctx = canvas.getContext('2d');

  // BACKGROUND
  const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, 900);
  bg.addColorStop(0,    '#0e0828');
  bg.addColorStop(0.4,  '#080520');
  bg.addColorStop(0.75, '#04030f');
  bg.addColorStop(1,    '#010108');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Nebula clouds
  [
    [CX-200, CY-180, 420, [60,30,140,0.28]],
    [CX+180, CY+160, 320, [20,50,130,0.22]],
    [CX,     CY,     500, [40,20,100,0.15]],
    [160,    920,    280, [30,60,140,0.18]],
    [920,    200,    260, [70,40,160,0.15]],
  ].forEach(([x,y,r,[cr,cg,cb,ca]]) => {
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0, `rgba(${cr},${cg},${cb},${ca})`);
    g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  });

  // Stars
  STARS.forEach(({x,y,r,a}) => {
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = `rgba(200,215,255,${a})`;
    ctx.fill();
  });

  // ── RING ──
  // Outer diffuse
  ctx.save();
  ctx.shadowColor = 'rgba(100,140,240,0.6)';
  ctx.shadowBlur  = 80;
  ctx.beginPath(); ctx.arc(CX,CY,RING_R,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(80,110,220,0.10)';
  ctx.lineWidth = 120; ctx.stroke();
  ctx.restore();

  // Mid halo
  ctx.save();
  ctx.shadowColor = 'rgba(150,180,255,0.5)';
  ctx.shadowBlur  = 45;
  ctx.beginPath(); ctx.arc(CX,CY,RING_R,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(140,170,250,0.30)';
  ctx.lineWidth = 42; ctx.stroke();
  ctx.restore();

  // Inner soft ring
  ctx.beginPath(); ctx.arc(CX,CY,RING_R,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(190,210,255,0.40)';
  ctx.lineWidth = 18; ctx.stroke();

  // Core gradient ring
  const rg = ctx.createLinearGradient(CX-RING_R,CY-RING_R,CX+RING_R,CY+RING_R);
  rg.addColorStop(0,   '#a0b8e0');
  rg.addColorStop(0.2, '#dde8ff');
  rg.addColorStop(0.4, '#8090c8');
  rg.addColorStop(0.6, '#c8d4f8');
  rg.addColorStop(0.8, '#9878d0');
  rg.addColorStop(1,   '#a0b8e0');
  ctx.beginPath(); ctx.arc(CX,CY,RING_R,0,Math.PI*2);
  ctx.strokeStyle = rg; ctx.lineWidth = 4; ctx.stroke();

  // Hot edge
  ctx.beginPath(); ctx.arc(CX,CY,RING_R-2,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(240,248,255,0.55)'; ctx.lineWidth = 1.5; ctx.stroke();

  // Ring sparkle dots
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI * 2;
    const dx = CX + Math.cos(angle) * RING_R;
    const dy = CY + Math.sin(angle) * RING_R;
    const sr = 2 + (i % 3);
    ctx.save();
    ctx.shadowColor = 'rgba(200,220,255,0.9)'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(dx,dy,sr,0,Math.PI*2);
    ctx.fillStyle = '#e8f0ff'; ctx.fill();
    ctx.restore();
  }

  // ── NUMBER — visually centred using actual bounding box metrics ──
  const fontSize = 400;
  const numStr = String(num);

  // Measure with alphabetic baseline to get true glyph extents
  ctx.font = `bold ${fontSize}px Georgia, serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'alphabetic';
  const m  = ctx.measureText(numStr);
  // actualBoundingBoxAscent  = distance from baseline UP to top of glyph
  // actualBoundingBoxDescent = distance from baseline DOWN to bottom of glyph
  const glyphH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  // Y we need to pass to fillText so the glyph's visual centre lands on CY:
  // baseline = CY + glyphH/2 - actualBoundingBoxDescent
  const numY = CY + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;

  // Gradient anchored to glyph extents
  const ng = ctx.createLinearGradient(CX, numY - m.actualBoundingBoxAscent,
                                       CX, numY + m.actualBoundingBoxDescent);
  ng.addColorStop(0,   '#ffffff');
  ng.addColorStop(0.2, '#eaf0ff');
  ng.addColorStop(0.5, '#a8c0f0');
  ng.addColorStop(0.8, '#c0d0ff');
  ng.addColorStop(1,   '#8090d0');

  // Glow pass 1
  ctx.save();
  ctx.shadowColor = 'rgba(140,170,255,0.95)'; ctx.shadowBlur = 90;
  ctx.fillStyle = ng;
  ctx.fillText(numStr, CX, numY);
  ctx.restore();

  // Glow pass 2 (softer halo)
  ctx.save();
  ctx.shadowColor = 'rgba(180,200,255,0.6)'; ctx.shadowBlur = 40;
  ctx.fillStyle = 'rgba(220,235,255,0.20)';
  ctx.fillText(numStr, CX, numY);
  ctx.restore();

  // number sparkles — follow visual centre numY
  SPARKLES.forEach(([dx,dy,sr]) => {
    ctx.save();
    ctx.shadowColor = 'rgba(200,220,255,0.9)'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(CX+dx, numY+dy, sr, 0, Math.PI*2);
    ctx.fillStyle = '#d8e8ff'; ctx.fill();
    ctx.restore();
  });

  // ── TOP — VANUELLA WATT ──
  ctx.save();
  ctx.shadowColor = 'rgba(160,190,255,0.8)'; ctx.shadowBlur = 20;
  ctx.font = '300 56px Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#e8f0ff';
  ctx.fillText('VANUELLA  WATT', CX, 64);
  ctx.restore();

  // ── SONG TITLE ──
  const titleY = CY + RING_R + 52;
  ctx.save();
  ctx.shadowColor = 'rgba(160,190,255,0.7)'; ctx.shadowBlur = 16;
  ctx.font = 'italic bold 54px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#d0dcf8';
  ctx.fillText('Lav I Stap Ol Taem', CX, titleY);
  ctx.restore();

  // ── PLATFORM TEXT ──
  ctx.save();
  ctx.font = '30px Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(180,200,240,0.80)';
  ctx.fillText('Disponible sur toutes les plateformes numériques le', CX, titleY + 76);
  ctx.restore();

  // ── DATE ──
  ctx.save();
  ctx.shadowColor = 'rgba(160,190,255,0.6)'; ctx.shadowBlur = 12;
  ctx.font = 'bold 44px Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('17 AVRIL 2026', CX, titleY + 120);
  ctx.restore();

  // ── SOCIAL ICONS ──
  const iconY   = titleY + 208;
  const iconR   = 42;
  const spacing = 110;
  // 4 icons: Spotify, TikTok, Instagram, YouTube
  const positions = [CX - spacing*1.5, CX - spacing*0.5, CX + spacing*0.5, CX + spacing*1.5];

  drawLogoIcon(ctx, positions[0], iconY, iconR, LOGOS.spotify,   drawSpotifyFallback);
  drawLogoIcon(ctx, positions[1], iconY, iconR, LOGOS.tiktok,    drawTikTokFallback);
  drawInstagram(ctx, positions[2], iconY, iconR);
  drawLogoIcon(ctx, positions[3], iconY, iconR, LOGOS.youtube,   drawYouTubeFallback);
}

// Draw a real image logo clipped to a circle
function drawLogoIcon(ctx, cx, cy, r, img, fallback) {
  if (img) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.clip();
    ctx.drawImage(img, cx-r, cy-r, r*2, r*2);
    ctx.restore();
  } else {
    fallback(ctx, cx, cy, r);
  }
}

// Fallbacks (in case images don't load)
function drawSpotifyFallback(ctx, x, y, r) {
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle = '#1DB954'; ctx.fill();
  ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=r*0.12; ctx.lineCap='round';
  [[0.5,1.1,2.0],[0.32,1.15,1.9],[0.15,1.2,1.85]].forEach(([fr,s,e]) => {
    ctx.beginPath(); ctx.arc(x,y,r*fr,Math.PI*s,Math.PI*e); ctx.stroke();
  }); ctx.restore();
}
function drawTikTokFallback(ctx, x, y, r) {
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle='#1a1a1a'; ctx.fill();
  ctx.fillStyle='#fff';
  ctx.fillRect(x-r*0.08,y-r*0.55,r*0.28,r*0.85);
  ctx.beginPath(); ctx.arc(x-r*0.08+r*0.08,y+r*0.30,r*0.22,0,Math.PI*2); ctx.fill();
}
function drawYouTubeFallback(ctx, x, y, r) {
  ctx.save();
  roundRect(ctx, x-r, y-r*0.65, r*2, r*1.3, r*0.25);
  ctx.fillStyle='#FF0000'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x-r*0.25,y-r*0.35); ctx.lineTo(x+r*0.38,y); ctx.lineTo(x-r*0.25,y+r*0.35);
  ctx.closePath(); ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// Instagram — drawn (no file available)
function drawInstagram(ctx, x, y, r) {
  // Gradient circle background
  const ig = ctx.createLinearGradient(x-r, y+r, x+r, y-r);
  ig.addColorStop(0,    '#f09433');
  ig.addColorStop(0.25, '#e6683c');
  ig.addColorStop(0.5,  '#dc2743');
  ig.addColorStop(0.75, '#cc2366');
  ig.addColorStop(1,    '#bc1888');
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = ig; ctx.fill();

  // Camera body
  const sr = r * 0.54, br = sr * 0.28;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.11;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x-sr+br, y-sr);
  ctx.lineTo(x+sr-br, y-sr); ctx.arcTo(x+sr,y-sr, x+sr,y-sr+br, br);
  ctx.lineTo(x+sr, y+sr-br); ctx.arcTo(x+sr,y+sr, x+sr-br,y+sr, br);
  ctx.lineTo(x-sr+br, y+sr); ctx.arcTo(x-sr,y+sr, x-sr,y+sr-br, br);
  ctx.lineTo(x-sr, y-sr+br); ctx.arcTo(x-sr,y-sr, x-sr+br,y-sr, br);
  ctx.closePath(); ctx.stroke();

  // Inner circle
  ctx.beginPath(); ctx.arc(x, y, sr*0.5, 0, Math.PI*2); ctx.stroke();

  // Top-right dot
  ctx.beginPath(); ctx.arc(x+sr*0.6, y-sr*0.6, r*0.08, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
}

// ── Download all ──
function downloadAll() {
  const canvases = document.querySelectorAll('canvas');
  canvases.forEach((canvas, i) => {
    const day = 10 - i;
    setTimeout(() => {
      const a = document.createElement('a');
      a.download = `lav-countdown-day-${String(day).padStart(2,'0')}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }, i * 450);
  });
}
